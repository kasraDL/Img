name = "immigration-position-bot"
main = "src/index.ts"
compatibility_date = "2026-08-21"

# ---- Storage bindings ----

[[d1_databases]]
binding = "DB"
database_name = "immigration_bot_db"
database_id = "f2ccdb60-9be6-44d6-b3e9-752dbae03029"

[[r2_buckets]]
binding = "CV_BUCKET"
bucket_name = "immigration-bot-cvs"

[[kv_namespaces]]
binding = "SESSIONS"
id = "9f2ff13b5817497ca26f1253a1c478b3"

[ai]
binding = "AI"

[triggers]
crons = ["0 9 * * *"]

# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET
# Optional: BRAVE_SEARCH_API_KEY
